name: Build and Deploy to HF Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/jonidartoz-max/mission-control:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install huggingface_hub -q
          python3 - << 'PYEOF'
          from huggingface_hub import HfApi
          import os
          api = HfApi(token=os.environ['HF_TOKEN'])
          dockerfile = "FROM ghcr.io/jonidartoz-max/mission-control:latest\n"
          api.upload_file(
              path_or_fileobj=dockerfile.encode(),
              path_in_repo='Dockerfile',
              repo_id='jonidartoz/mission-control',
              repo_type='space',
              commit_message='deploy: update to latest build',
          )
          print('HF Space updated!')
          PYEOF
